batch_size: 2
device: auto
epochs: 12
learning_rate: 0.0001
output_dir: outputs/mvp1_stageG_local_nodrift
seed: 42
threshold: 0.5
train_samples: 80
val_samples: 20
volume_shape:
  - 32
  - 32
  - 32

use_drift_loss: false
lambda_drift: 0.0
drift_lambda_warmup_epochs: 4
drift_temperature: 0.1
drift_feature_pool: 2
drift_pool_scales: [2]
drift_pos_weight: 1.2
drift_neg_weight: 0.8
drift_boundary_gamma: 0.0
drift_delta_t_beta: 1.5
drift_delta_t_center: 0.6
drift_use_memory_bank: true
drift_neg_bank_size: 64
drift_feature_source: probs

use_local_token_drift: false
lambda_local_drift: 0.0
local_lambda_warmup_epochs: 4
token_patch_size: 4
token_stride: 4
token_temperature: 0.1
token_pos_weight: 1.2
token_neg_weight: 0.8
token_boundary_gamma: 0.0
token_delta_t_beta: 1.5
token_delta_t_center: 0.6
token_use_memory_bank: true
token_neg_bank_size: 64
token_feature_source: latent
token_feature_key: dec1

dataset_params:
  baseline_components_min: 1
  baseline_components_max: 3
  baseline_radius_min: 2
  baseline_radius_max: 7
  center_margin: 8
  growth_seed_min: 2
  growth_seed_max: 5
  growth_radius_min: 2
  growth_radius_max: 6
  shift_prob: 0.55
  shift_voxel_max: 3
  satellite_prob: 0.35
  satellite_offset_max: 14
  satellite_radius_min: 1
  satellite_radius_max: 3
  delta_t_min: 0.2
  delta_t_max: 1.2
  growth_steps_min: 2
  growth_steps_max: 8
